name: Framework packs

on:
  pull_request:
    paths:
      - "frameworks/**"
      - "tools/validate_frameworks.py"
      - ".github/workflows/frameworks.yml"
  push:
    branches: [main]
    paths:
      - "frameworks/**"
      - "tools/validate_frameworks.py"
      - ".github/workflows/frameworks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Compile validator
        run: python -m py_compile tools/validate_frameworks.py
      - name: Validate framework packs
        run: python tools/validate_frameworks.py
