name: API and tenant isolation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: api-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build and migrate the development stack
        run: docker compose up --build --wait db migrate
      - name: Run API and PostgreSQL isolation tests
        run: docker compose --profile test run --rm api-tests
      - name: Verify committed OpenAPI and Postman artifacts
        run: docker compose --profile test run --no-deps --rm api-tests python tools/export_api_artifacts.py --check
      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs db migrate
