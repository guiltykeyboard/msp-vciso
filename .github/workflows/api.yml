name: API and tenant isolation

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "db/**"
      - "tests/**"
      - "requirements*.txt"
      - "alembic.ini"
      - "docker-compose.yml"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "db/**"
      - "tests/**"
      - "requirements*.txt"
      - "alembic.ini"
      - "docker-compose.yml"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build and migrate the development stack
        run: docker compose up --build --wait db migrate
      - name: Run API and PostgreSQL isolation tests
        run: docker compose --profile test run --rm api-tests
      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs db migrate
