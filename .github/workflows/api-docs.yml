name: API documentation

on:
  pull_request:
    paths:
      - "api/**"
      - "apps/api/**"
      - "tools/export_api_artifacts.py"
      - "requirements*.txt"
      - ".github/workflows/api-docs.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "apps/api/**"
      - "tools/export_api_artifacts.py"
      - "requirements*.txt"
      - ".github/workflows/api-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install API dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Verify generated API documentation
        run: python tools/export_api_artifacts.py --check
      - name: Upload API documentation artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: api

  deploy:
    if: github.event_name != 'pull_request'
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy API reference
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
