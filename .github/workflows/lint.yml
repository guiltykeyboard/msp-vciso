name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install lint dependencies
        run: python -m pip install --requirement requirements.txt --requirement requirements-dev.txt
      - name: Run Pylint
        run: python -m pylint tools apps db/migrations tests
      - name: Enforce repository workflow policy
        run: python tools/validate_workflows.py
      - name: Validate GitHub Actions workflows
        run: |
          mkdir -p /tmp/actionlint
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output /tmp/actionlint/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint/actionlint.tar.gz" \
            | sha256sum --check
          tar -xzf /tmp/actionlint/actionlint.tar.gz -C /tmp/actionlint actionlint
          /tmp/actionlint/actionlint -color
