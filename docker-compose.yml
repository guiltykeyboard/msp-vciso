name: watchtower-grc

services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: watchtower
      POSTGRES_PASSWORD: watchtower_admin_dev_password
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d watchtower"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/bootstrap:/docker-entrypoint-initdb.d:ro

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_ADMIN_URL: postgresql+psycopg://postgres:watchtower_admin_dev_password@db:5432/watchtower
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://watchtower_runtime:watchtower_dev_password@db:5432/watchtower
      WATCHTOWER_ALLOW_INSECURE_DEV_AUTH: "true"
      WATCHTOWER_ENVIRONMENT: development
      WATCHTOWER_STORAGE_PROVIDER: ${WATCHTOWER_STORAGE_PROVIDER:-disabled}
      WATCHTOWER_S3_BUCKET: ${WATCHTOWER_S3_BUCKET:-watchtower-evidence}
      WATCHTOWER_S3_REGION: ${WATCHTOWER_S3_REGION:-us-east-1}
      WATCHTOWER_S3_ENDPOINT_URL: ${WATCHTOWER_S3_ENDPOINT_URL:-http://object-store:9000}
      WATCHTOWER_S3_PUBLIC_ENDPOINT_URL: ${WATCHTOWER_S3_PUBLIC_ENDPOINT_URL:-http://localhost:59000}
      WATCHTOWER_S3_ADDRESSING_STYLE: ${WATCHTOWER_S3_ADDRESSING_STYLE:-path}
      WATCHTOWER_CREDENTIAL_ENCRYPTION_KEY: ${WATCHTOWER_CREDENTIAL_ENCRYPTION_KEY:-}
      WATCHTOWER_TRUST_CNAME_TARGET: ${WATCHTOWER_TRUST_CNAME_TARGET:-trust.localhost}
      WATCHTOWER_TRUST_TLS_AUTHORIZATION_SECRET: ${WATCHTOWER_TRUST_TLS_AUTHORIZATION_SECRET:-watchtower_trust_tls_development_secret}
      AWS_ACCESS_KEY_ID: ${WATCHTOWER_MINIO_ROOT_USER:-watchtower_minio_dev}
      AWS_SECRET_ACCESS_KEY: ${WATCHTOWER_MINIO_ROOT_PASSWORD:-watchtower_minio_dev_password}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"

  api-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["pytest"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:watchtower_admin_dev_password@db:5432/watchtower
      DATABASE_URL: postgresql://watchtower_runtime:watchtower_dev_password@db:5432/watchtower
      WATCHTOWER_ALLOW_INSECURE_DEV_AUTH: "true"
      WATCHTOWER_ENVIRONMENT: test
      WATCHTOWER_TRUST_CNAME_TARGET: ${WATCHTOWER_TRUST_CNAME_TARGET:-trust.localhost}
      WATCHTOWER_TRUST_TLS_AUTHORIZATION_SECRET: ${WATCHTOWER_TRUST_TLS_AUTHORIZATION_SECRET:-watchtower_trust_tls_development_secret}

  web:
    build:
      context: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"

  object-store:
    profiles: [storage]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${WATCHTOWER_MINIO_ROOT_USER:-watchtower_minio_dev}
      MINIO_ROOT_PASSWORD: ${WATCHTOWER_MINIO_ROOT_PASSWORD:-watchtower_minio_dev_password}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio-data:/data

  object-store-bootstrap:
    profiles: [storage]
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      object-store:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://object-store:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/watchtower-evidence
    environment:
      MINIO_ROOT_USER: ${WATCHTOWER_MINIO_ROOT_USER:-watchtower_minio_dev}
      MINIO_ROOT_PASSWORD: ${WATCHTOWER_MINIO_ROOT_PASSWORD:-watchtower_minio_dev_password}

volumes:
  minio-data:
  postgres-data:
